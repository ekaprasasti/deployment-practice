version: "3.9"

name: poc-deployment-version

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_DB: ${PGDATABASE:-appdb}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-current:
    build:
      context: ./app
    image: poc-deployment-api:${CURRENT_VERSION:-v1.0.0}
    container_name: api-${CURRENT_VERSION:-v1.0.0}
    environment:
      PORT: 3000
      APP_VERSION: ${CURRENT_VERSION:-v1.0.0}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-appdb}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  api-new:
    build:
      context: ./app
    image: poc-deployment-api:${NEW_VERSION:-v1.0.1}
    container_name: api-${NEW_VERSION:-v1.0.1}
    environment:
      PORT: 3000
      APP_VERSION: ${NEW_VERSION:-v1.0.1}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-appdb}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    profiles: ["deployment"]

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    depends_on:
      - api-current
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/version-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      CURRENT_VERSION: ${CURRENT_VERSION:-v1.0.0}
      NEW_VERSION: ${NEW_VERSION:-v1.0.1}

volumes:
  pgdata:
