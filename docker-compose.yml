version: "3.9"

name: poc-deployment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_DB: ${PGDATABASE:-appdb}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-current:
    build:
      context: ./app
    environment:
      PORT: 3000
      APP_VERSION: ${CURRENT_VERSION:-v1.0.0}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-appdb}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    profiles: ["current", "canary", "all"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  api-next:
    build:
      context: ./app
    environment:
      PORT: 3000
      APP_VERSION: ${NEXT_VERSION:-v1.1.0}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-appdb}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    profiles: ["next", "canary", "all"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  nginx-current:
    image: nginx:1.27-alpine
    depends_on:
      - api-current
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/current.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["current"]

  nginx-next:
    image: nginx:1.27-alpine
    depends_on:
      - api-next
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/next.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["next"]

  nginx-canary:
    image: nginx:1.27-alpine
    depends_on:
      - api-current
      - api-next
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/canary.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["canary"]

volumes:
  pgdata:


